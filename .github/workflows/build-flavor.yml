name: Build flavor

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
      build-type:
        required: true
        type: string
      retention-days:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Android APK (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # .fvmrc is the single source of truth for the SDK version
      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Infos (mostly deprecations) are reported but don't fail the build
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Each flavor has its own signing key (ANDROID_KEYSTORE_DEV_* / ANDROID_KEYSTORE_PROD_*)
      # so every APK of a flavor can update the previously installed one
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets[format('ANDROID_KEYSTORE_{0}_BASE64', inputs.flavor)] }}
          FLAVOR: ${{ inputs.flavor }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_${FLAVOR^^}_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('ANDROID_KEYSTORE_{0}_PASSWORD', inputs.flavor)] }}
          ANDROID_KEY_ALIAS: todo-${{ inputs.flavor }}
        run: flutter build apk --flavor ${{ inputs.flavor }} --${{ inputs.build-type }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-${{ inputs.flavor }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.flavor }}-${{ inputs.build-type }}.apk
          retention-days: ${{ inputs.retention-days }}
