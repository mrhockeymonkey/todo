name: Build flavor

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
      build-type:
        required: true
        type: string
      retention-days:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Android APK (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --flavor ${{ inputs.flavor }} --${{ inputs.build-type }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-${{ inputs.flavor }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.flavor }}-${{ inputs.build-type }}.apk
          retention-days: ${{ inputs.retention-days }}
